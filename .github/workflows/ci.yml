name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies 📦
        run: uv sync --all-extras --dev

      - name: Run tests 🧪
        run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies 📦
        run: uv sync --all-extras --dev

      - name: Run e2e demo notebooks 🧪
        run: uv run python scripts/run_e2e_demos.py

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      already-published: ${{ steps.version-check.outputs.already-published }}
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.1

      - name: Set up Python 🐍
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check if version already published 🔍
        id: version-check
        run: |
          NAME=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])")
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/$NAME/$VERSION/json)
          if [ "$STATUS" = "200" ]; then
            echo "already-published=true" >> $GITHUB_OUTPUT
          else
            echo "already-published=false" >> $GITHUB_OUTPUT
          fi

      - name: Build 🏗️
        if: steps.version-check.outputs.already-published == 'false'
        run: uv build

      - name: Upload dist artifacts 📤
        if: steps.version-check.outputs.already-published == 'false'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.already-published == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts 📥
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish to PyPI 🚀
        run: uv publish
