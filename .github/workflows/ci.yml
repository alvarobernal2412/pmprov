name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.0

      - name: Set up Python 🐍
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies 📦
        run: uv sync --all-extras --dev

      - name: Run tests 🧪
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v7.0.0

      - name: Set up Python 🐍
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build 🏗️
        run: uv build

      - name: Upload dist artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts 📥
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv 📦
        uses: astral-sh/setup-uv@v8.2.0

      - name: Publish to PyPI 🚀
        run: uv publish
