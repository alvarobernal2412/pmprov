[project]
name = "pmprov"
version = "0.4.0"
description = "Analytic provenance tracking middleware for exploratory process mining."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipywidgets==8.1.8",
    "marimo==0.23.16",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
# Preferred storage backend (also enables native Parquet querying)
duckdb = ["duckdb==1.5.5"]
# Required for pandas DataFrame → Parquet serialisation
parquet = ["pyarrow==25.0.1"]
# In-memory graph support for load_graph() → networkx; matplotlib for show_graph()
graph = [
    "networkx==3.6.1",
    "matplotlib==3.11.1",
]
# Interactive provenance widget for show_graph_widget() in Jupyter
widgets = [
    "ipywidgets==8.1.8",
]
# Install everything at once: uv pip install -e ".[full]"
full = ["duckdb==1.5.5", "pyarrow==25.0.1", "networkx==3.6.1", "matplotlib==3.11.1", "ipywidgets==8.1.8"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-testmon==2.2.0",
    "pre-commit==4.6.2",
    "networkx==3.6.1",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "tracker*"]
