[project]
name = "pmprov"
version = "0.10.0"
description = "Analytic provenance tracking middleware for exploratory process mining."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipywidgets==8.1.9",
    "marimo==0.25.2",
    "matplotlib==3.11.2",
    "pandas==3.1.0",
    "plotly==7.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
# Preferred storage backend (also enables native Parquet querying)
duckdb = ["duckdb==2.0.0"]
# Required for pandas DataFrame → Parquet serialisation
parquet = ["pyarrow==26.0.0"]
# In-memory graph support for load_graph() → networkx; matplotlib for show_graph()
graph = [
    "networkx==3.7",
    "matplotlib==3.11.2",
]
# Interactive provenance widget for show_graph_widget() in Jupyter
widgets = [
    "ipywidgets==8.1.9",
]
# Install everything at once: uv pip install -e ".[full]"
full = ["duckdb==2.0.0", "pyarrow==26.0.0", "networkx==3.7", "matplotlib==3.11.2", "ipywidgets==8.1.9"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-testmon==2.2.0",
    "pre-commit==4.7.0",
    "networkx==3.7",
    "nbconvert==7.17.2",
    "ipykernel==7.4.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "tracker*"]
